# Checks the niri session's shipped configuration without building the image.
#
#   GREEN = niri accepts config.kdl, and every shipped .qml type-checks
#           against the Quickshell the image actually installs.
#   RED   = a change to the session would ship broken. For config.kdl that
#           means niri starts on upstream's default config instead, without
#           your binds and with a terminal bind (alacritty) that does nothing.
#
# Cheap enough to run on every PR that touches the config: one Fedora 44
# container, no image build. It cannot tell you the session *looks* right, or
# that the units start in the right order — only booting the image does that.
# Nor whether `qs` starts on the pinned base's Qt: the image build checks that
# itself, at the end of recipes/niri-session.yml.

name: niri-session-config-check

on:
  push:
    branches: [main]
    paths: &session-paths
      - "files/system/etc/xdg/quickshell/**"
      - "files/system/etc/niri/**"
      - "files/system/usr/lib/systemd/user/**"
      - ".github/workflows/niri-session-config-check.yml"
  pull_request:
    paths: *session-paths
  workflow_dispatch:

jobs:
  check:
    name: niri validate + qmllint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Must track the Fedora release the base image is built on, so the
      # niri and quickshell here are the ones the image ships.
      image: registry.fedoraproject.org/fedora:46@sha256:36b161974089bbf0155ef8a3efb8c0be6c37d157a83abe183ec3befc51f2ea95
    steps:
      - uses: actions/checkout@v7.0.1

      # qt6-qtdeclarative-devel is only here for qmllint. quickshell comes
      # from the same COPR as in recipes/niri-session.yml.
      - name: Install niri, quickshell and qmllint
        run: |
          dnf install -y dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False \
            niri quickshell qt6-qtdeclarative-devel

      - name: Validate the niri config
        # niri validate exits 1 on a config it cannot parse.
        run: niri validate -c files/system/etc/niri/config.kdl

      - name: Type-check every shipped QML file
        working-directory: files/system/etc/xdg/quickshell/chauvenity
        run: |
          status=0
          for f in *.qml; do
            # "PanelWindow is not creatable" is a known qmllint false positive
            # for Quickshell's window types; anything else is real.
            out=$(qmllint-qt6 -I /usr/lib64/qt6/qml -I . "$f" 2>&1 \
                  | grep -E '^(Error|Warning)' \
                  | grep -v 'PanelWindow is not creatable') || true
            if [ -n "$out" ]; then
              echo "::error file=files/system/etc/xdg/quickshell/chauvenity/$f::$out"
              status=1
            else
              echo "ok  $f"
            fi
          done
          exit $status


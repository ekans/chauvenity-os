---
name: chauvenity-os
description: Personal image

base-image: ghcr.io/ublue-os/bluefin-dx
# Digest-pin: BlueBuild has no first-class digest field. Relies on the CLI's
# lenient (unanchored) Tag parser accepting tag@digest. Renovate bumps the
# digest (see .github/renovate.json5). Re-verify on CLI upgrades.
# See docs/adr/0003-pin-base-digest-renovate.md.
image-version: stable@sha256:e3e83b371d7feb0e3ff34e674a2d817146469e5cc2b6cd37cc430d92c34381f8

modules:
  - type: chezmoi
    repository: "https://github.com/ekans/dotfiles"
    file-conflict-policy: replace

  # The display manager: greetd with a Quickshell greeter, instead of GDM. Its
  # login and greeter files are in the `files` module below. Before tools.yml on
  # purpose: greetd's sysusers scriptlet runs systemd-sysusers over every
  # sysusers.d file, so installed after install-1password.sh it writes the
  # 1Password groups back into /etc/group (test/image-contract.sh checks).
  - from-file: greetd.yml

  - from-file: tools.yml
  - from-file: erlang-deps.yml
  - from-file: phoenix-deps.yml

  # Second desktop session: niri + Quickshell. The greeter offers it first and
  # GNOME one Tab away; no GNOME package or GNOME setting is touched.
  - from-file: niri-session.yml

  # Select the fr keymap for the LUKS unlock prompt via rd.vconsole.keymap=fr
  # (files/system/usr/lib/bootc/kargs.d). Upstream bluefin-dx again bakes
  # fr.map.gz into its initramfs, so the local dracut drop-in was removed.
  # See docs/adr/0002-fr-keymap-rd-vconsole-karg.md (supersedes 0001).
  #
  # Also carries the niri session's system defaults — /etc/niri/config.kdl and
  # /etc/xdg/quickshell/chauvenity/, both overridable from ~/.config — and the
  # session's systemd user units under usr/lib/systemd/user. And greetd's:
  # /etc/greetd, /etc/pam.d/greetd, the greeter in
  # /etc/xdg/quickshell/chauvenity-greeter (+ chauvenity-lock), the greeter
  # user's home (tmpfiles) and a preset that keeps greetd the display manager on
  # a fresh install. This module has to stay
  # after the dnf modules, since /etc/pam.d/greetd replaces the package's.
  #
  # Also creates /var/opt before BlueBuild links the /opt apps into it
  # (files/system/usr/lib/tmpfiles.d), so they exist on a fresh install's
  # first boot.
  - type: files
    files:
      - source: system
        destination: /

  - type: signing

  # Must remain last: regenerates the initramfs after all other modules have
  # dropped their files into the image.
  - type: initramfs

# User-facing tools and applications
modules:
  - type: dnf
    repos:
      copr:
        - jdxcode/mise
        - scottames/ghostty
        - aleasto/waydroid
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        - brave-browser
        # Microsoft 365 mail + calendar with server-side RSVP. Layered as RPMs,
        # not the Flathub Flatpak: the sandboxed build cannot reach the host
        # keyring, so OAuth2 tokens fail ("OAuth2 Secret Not Found").
        # https://github.com/flathub/org.gnome.Evolution/issues/222
        # evolution-ews adds the "Microsoft 365" (Graph) account type, which
        # survives the Exchange Online EWS shutdown (1 Oct 2026 → 1 Apr 2027).
        - evolution
        - evolution-ews
        - ghostty
        - mise
        - waydroid
        # Docker Sandboxes (sbx) — installed directly from upstream RPM URL.
        # The `dnf` module accepts http(s) URLs under install.packages.
        # https://blue-build.org/reference/modules/dnf/
        # renovate: datasource=github-releases depName=docker/sbx-releases
        - https://github.com/docker/sbx-releases/releases/download/v0.30.0/DockerSandboxes-linux-amd64-rockylinux8.rpm

  # 1Password, installed by a local copy of the bling module's installer.
  # Upstream bling is broken: it installs a .desktop file the RPM no longer
  # ships. See blue-build/modules#581 and files/scripts/install-1password.sh.
  - type: script
    scripts:
      - install-1password.sh

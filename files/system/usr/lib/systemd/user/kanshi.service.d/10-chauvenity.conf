# Fall back to the shipped /etc/kanshi/config when the user has no config of
# their own. kanshi only reads $XDG_CONFIG_HOME/kanshi/config (or
# ~/.config/kanshi/config) and exits when it is missing, so a file in /etc
# would otherwise be ignored. The choice is made at start: after creating or
# deleting ~/.config/kanshi/config, `systemctl --user restart kanshi`.
#
# Started only by the niri session (niri.service.d/10-chauvenity-session.conf);
# GNOME does not implement wlr-output-management, so kanshi cannot run there.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'c="$${XDG_CONFIG_HOME:-$$HOME/.config}/kanshi/config"; [ -e "$$c" ] || c=/etc/kanshi/config; exec /usr/bin/kanshi -c "$$c"'

# mako's default-timeout is 0, i.e. notifications stay until clicked or
# dismissed with makoctl, and pile up in the corner. Expire them after 10 s.
#
# The command-line flag overrides a global default-timeout in the user's
# ~/.config/mako/config; per-criteria sections there still apply. Not shipped
# as /etc/xdg/mako/config because mako only reads ~/.mako/config and
# $XDG_CONFIG_HOME/mako/config, so that file would be silently ignored.
#
# Only takes effect where mako runs, and only the niri session wants it.
[Service]
ExecStart=
ExecStart=/usr/bin/mako --default-timeout=10000

# The niri session's daemons, pulled in from niri.service.
#
# Two reasons this is a drop-in on niri.service rather than spawn-at-startup
# lines in config.kdl or an [Install] section on each unit:
#
#  1. It is niri-only by construction. niri.service has no [Install] section
#     and is started only by /usr/bin/niri-session, i.e. only by picking Niri
#     in GDM. Enabling these the ordinary way would be wrong: mako.service's
#     own [Install] is WantedBy=graphical-session.target, which GNOME also
#     reaches, so `systemctl --global enable mako` would start a second
#     notification daemon inside GNOME. Wanting it from here cannot.
#  2. It survives a broken config. If ~/.config/niri/config.kdl fails to
#     parse, niri does not fall back to /etc/niri/config.kdl — it starts on
#     upstream's default config, whose terminal bind (Mod+T, alacritty) does
#     nothing on this image. Anything launched by spawn-at-startup would
#     silently not run, including the lock screen.
#
# The chauvenity-* units use BindsTo=niri.service rather than PartOf: PartOf
# only propagates an explicit `systemctl stop niri.service`. When niri exits on
# its own the units would otherwise outlive it — the polkit agent
# restart-looping until it fails, the keyring oneshot sitting active forever.
#
# To drop one of these for your user: systemctl --user mask <unit>.
[Unit]
Wants=chauvenity-swayidle.service
Wants=chauvenity-polkit-agent.service
Wants=chauvenity-keyring-components.service
Wants=mako.service
# SSH agent. Its only other puller is gnome-session-services.target, which a
# niri login never reaches. After= so the socket's ExecStartPost has exported
# SSH_AUTH_SOCK before niri, and everything it spawns, starts.
Wants=gcr-ssh-agent.socket
After=gcr-ssh-agent.socket

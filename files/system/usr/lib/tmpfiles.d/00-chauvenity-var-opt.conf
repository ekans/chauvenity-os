# Create /var/opt before BlueBuild's optfix links /opt/<app> into it.
#
# /opt is a symlink to /var/opt. BlueBuild writes each `L+? "/opt/<app>"`
# line to 99-bluebuild-optfix-<app>.conf, and tmpfiles reads its configs in
# filename order, so those lines run before rpm-ostree's
# rpm-ostree-0-integration-opt-usrlocal.conf creates /var/opt. On the empty
# /var of a fresh install's first boot they fail, and Brave and 1Password
# are missing until the next boot. This file sorts first.
d /var/opt 0755 root root -

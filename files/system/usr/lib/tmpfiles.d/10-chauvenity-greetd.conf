# The greeter user's home, /var/lib/greetd, which a fresh install's /var does
# not have: the greetd package makes it, in /var, at build time, and the
# package's own tmpfiles line only fixes the owner of one that exists. Without
# it the greeter's systemd user manager has no home, and runs
# chezmoi-init.service (the chezmoi module enables it for every user) which
# fails on `mkdir /var/lib/greetd`.
#
# With a home it would succeed instead: clone the dotfiles over the network
# and apply them to the greeter user, at the login screen. So mask it, the way
# the greetd package masks xdg-desktop-portal.service in its %post, a mask
# that is lost together with the home.
d /var/lib/greetd                                                  0750 greetd greetd -
d /var/lib/greetd/.config                                          0755 greetd greetd -
d /var/lib/greetd/.config/systemd                                  0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user                             0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service  -    -      -     - /dev/null
L /var/lib/greetd/.config/systemd/user/chezmoi-init.service        -    -      -     - /dev/null
